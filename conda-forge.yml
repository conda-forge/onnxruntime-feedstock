build_platform:
  linux_ppc64le: linux_64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
github_actions:
  timeout_minutes: 720
  triggers:
  - push
  - pull_request
provider:
  linux_64: github_actions
  linux_aarch64: default
  osx_arm64: default
  win_64: github_actions
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
  - os: win
    provider: azure
    value: C:\bld\
  free_disk_space:
  - provider: azure
    value: quick
  pagefile_size:
  - os: linux
    provider: azure
    value: 10
  - os: win
    provider: azure
    value: 16
  tools_install_dir:
  - os: win
    provider: azure
    value: C:\Miniforge
