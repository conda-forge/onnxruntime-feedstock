{% set cuda_enabled = cuda_compiler_version != "None" %}
{% set build_ext = ("cuda" ~ cuda_compiler_version).replace(".", "") if cuda_enabled else "cpu" %}
{% set version = "1.30.0" %}
{% set suffix = "" %}  # [suffix == None]
{% set build = 0 %}

{% if cuda_enabled %}
{% set build = build + 200 %}
{% endif %}

{% if cuda_compiler_version in (None, "None", True, False) %}
{% set cuda_major = 0 %}
{% else %}
{% set cuda_major = environ.get("cuda_compiler_version", "11.8").split(".")[0] | int %}
{% endif %}

package:
  name: onnxruntime{{ suffix }}
  version: {{ version }}

source:
  url: https://github.com/microsoft/onnxruntime/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f6681ecbddf53898adf0cc9e8e9e84657485b84d2eca3c8aa353de6d7dd417ef
  patches:
    # Workaround for https://github.com/conda-forge/onnxruntime-feedstock/pull/56#issuecomment-1586080419
    - patches/0001-avoid-conflicting-with-onnxruntime.dll-in-system32.patch     # [win]
    # https://github.com/conda-forge/onnxruntime-feedstock/pull/128#issuecomment-2390332504
    - patches/0002-use-first-nvcc-found.patch
    # Improve compatibility between Visual Studio 19.41 + cuda 12.0 (they require 12.4 by default)
    # Upstream suggestion https://github.com/microsoft/onnxruntime/pull/22332
    - patches/0003-Add-_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH-for-cud.patch
    # Fix endian.h shadowing system header for glibc 2.17
    - patches/0004-Remove-redundant-include-paths-from-custom-op-test-t.patch
    # Upstream is actually compatible with 3.10
    - patches/0005-Lower-python_require-to-3.10.patch
    # New test in 1.28.0 lacks the skip guard its siblings have when onnx is absent
    - patches/0006-Skip-adapter-string-tensor-test-without-onnx.patch
    # autoep test gained a module-level onnx import in 1.28.0 but runs before
    # build.py's "onnx is not installed" gate
    - patches/0007-Guard-onnx-import-in-autoep-test.patch
    - patches/0008-Copy-python-test-files-in-batches.patch
    - patches/0009-Use-the-conda-forge-libcoremltools-package-for-the-C.patch  # [osx and arm64]
    - patches/0010-Use-the-conda-forge-libabseil-package.patch
    # protobuf deprecated RepeatedField::Resize; /sdl makes that an error on Windows
    - patches/0011-Use-RepeatedField-resize-instead-of-the-deprecated-R.patch

build:
  number: {{ build }}
  # don't build cuda versions with novec
  skip: true  # [ (cuda_compiler_version != "None") and suffix == "-novec"]
  # TEMPORARY: exploratory phase, build and test python 3.12 only. Revert before merge.
  skip: true  # [py != 312]
  # Since 1.11, power9 seems to be required.
  skip: true  # [ppc64le]
  skip: true  # [osx and x86_64]
  string: py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}_{{ build_ext }}
  ignore_run_exports_from:
    - zlib
  # This needs to be coherent with the entry_points list defined around
  # https://github.com/microsoft/onnxruntime/blob/main/setup.py#L735
  entry_points:
    - onnxruntime_test = onnxruntime.tools.onnxruntime_test:main

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - pybind11                               # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}  # [cuda_compiler_version != "None"]
    {% if cuda_major >= 12 %}
    - cuda-cudart-dev                        # [build_platform != target_platform]
    - cuda-nvrtc-dev                         # [build_platform != target_platform]
    {% endif %}
    - cmake <4
    - ninja
    # we need protoc in the build environment for cross compilations
    - libprotobuf
    # flatc (from flatbuffers) regenerates the schema headers in build.sh and
    # must run on the build platform when cross compiling
    - flatbuffers
  host:
    - python
    - pip
    - setuptools
    - wheel
    - cudnn                                     # [cuda_compiler_version != "None"]
    - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
    {% if cuda_major >= 12 %}
    - libcublas-dev
    - libcusparse-dev
    - libcurand-dev
    - libcufft-dev
    - cuda-cudart-dev
    - cuda-nvrtc-dev
    {% endif %}
    - flake8
    - gmock
    - libdate
    # Known limitation: the conda-forge libonnx does not carry onnxruntime's
    # vendored patch that un-deprecates the opset-18 GroupNormalization op, so
    # models with an ai.onnx GroupNormalization node at opset 18-20 are rejected
    # (INVALID_GRAPH); re-export or version-convert them to opset >= 21. Rare in
    # practice -- mainstream exporters decompose group norm rather than emit it.
    - libabseil
    - libprotobuf
    - libonnx
    # The conda `onnx` (Python) package supplies ONNX's .proto sources for the
    # onnx_test_data_proto C++ unit-test target (see build.sh; onnx_SOURCE_DIR).
    # build.py's python test phase is not run, so we don't import python onnx
    # alongside onnxruntime here and any onnx providing the .proto suffices.
    # (At python *runtime*, sharing onnx-ml.proto with onnxruntime needs an onnx
    # that links the shared libonnx -- onnx-feedstock PR #146; not required for
    # this build.)
    - onnx
    - re2
    - flatbuffers
    - packaging
    - python-flatbuffers
    - optional-lite
    # Used by the CoreML execution provider to build mlpackage models;
    # onnxruntime finds it via find_package, so prefer the conda-forge build.
    - nlohmann_json  # [osx and arm64]
    - libcoremltools  # [osx and arm64]
    - zlib
    - numpy
    - pybind11
  run:
    - packaging
    - protobuf
    - python
    - python-flatbuffers
    # avoid that people without GPUs needlessly download ~0.5-1GB
    - __cuda                                    # [cuda_compiler_version != "None"]
  run_constrained:
    - onnxruntime <0a0  # [suffix == "-novec"]
    # libonnx's run_exports pin only the version. Builds 0-4 of libonnx 1.22.0 do not
    # export all the ONNX symbols onnxruntime links against, or ship a second copy of
    # the onnx protobuf descriptors in libonnx_proto (conda-forge/onnx-feedstock
    # PRs 157, 158 and 159), so require build 5 at runtime too. A build_number bracket spec cannot be used: conda-build
    # re-parses the rendered recipe before testing and reads it as a selector.
    # Scoped to the 1.22.0 pin so a libonnx migration drops it; bump by hand otherwise.
    {% if libonnx == "1.22.0" %}
    - libonnx >=1.22.0,<1.22.1.0a0 *_5
    {% endif %}

test:
  imports:
    - onnxruntime
  files:
    - test_onnxruntime_runtime.py
  commands:
    - pip check
    - onnxruntime_test --help
    # Runtime tests against onnx's reference evaluator: onnx and onnxruntime in
    # one process, contrib fusions, ORT format and LoRA adapters (flatbuffers),
    # CoreML on Apple Silicon and loading the CUDA provider library. On a machine
    # with a GPU, set ONNXRUNTIME_TEST_REQUIRE_CUDA=1 to also run on CUDA.
    - python test_onnxruntime_runtime.py
  requires:
    - pip
    # onnx builds the test models, checks them and provides the reference
    # evaluator, sharing libonnx with onnxruntime in the same process.
    - onnx
    # 2024/05 hmaarrfk/jtilly
    # Test the pip check command with numpy < 2
    # which was included in the requirements file for
    # build time compatibility
    - numpy 1.26.*   # [py == 312]

outputs:
  - name: onnxruntime{{ suffix }}
  - name: onnxruntime{{ suffix }}-cpp
    build:
      string: h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}_{{ build_ext }}
      run_exports:
        - {{ pin_subpackage('onnxruntime' + suffix + '-cpp', max_pin='x.x.x') }}
    script: install-cpp.sh  # [unix]
    script: install-cpp.bat  # [win]
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}  # [cuda_compiler_version != "None"]
      host:
        # libonnxruntime links these now-unvendored shared libraries
        # (onnx, protobuf, abseil, re2, and coremltools on osx-arm64). The main
        # onnxruntime output picks them
        # up automatically because it compiles libonnxruntime, but this output
        # only repackages the prebuilt libs via install-cpp.sh/.bat, so
        # conda-build cannot infer them. List them here so their run_exports
        # pin them into this package's run requirements; otherwise downstream
        # C++ consumers (and the cmake-package-check test) fail to link with
        # undefined onnx::/google::protobuf:: symbols, or on Windows fail to
        # load onnx.dll/libprotobuf.dll at runtime.
        - libonnx
        - libprotobuf
        - libabseil
        - re2
        - libcoremltools  # [osx and arm64]
      run:
        - __cuda    # [cuda_compiler_version != "None"]
      run_constrained:
        - onnxruntime-cpp <0a0  # [suffix == "-novec"]
        # See the libonnx build_number constraint on the onnxruntime output.
        {% if libonnx == "1.22.0" %}
        - libonnx >=1.22.0,<1.22.1.0a0 *_5
        {% endif %}
    test:
      requires:
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - cmake-package-check
        - cmake
        - ninja
      files:
        - test.cpp
        - run_cpp_test.bat  # [win]
        - cpp_interop/CMakeLists.txt
        - cpp_interop/test_onnx_interop.cpp
      commands:
        - test -f $PREFIX/include/onnxruntime/core/session/onnxruntime_cxx_api.h  # [unix]
        - test -f $PREFIX/include/onnxruntime/core/providers/coreml/coreml_provider_factory.h  # [osx and arm64]
        - test -f $PREFIX/lib/libonnxruntime${SHLIB_EXT}  # [unix]
        - test -f $PREFIX/lib/libonnxruntime_providers_shared${SHLIB_EXT}  # [unix and cuda_compiler_version != "None"]
        - test -f $PREFIX/lib/libonnxruntime_providers_cuda${SHLIB_EXT}  # [unix and cuda_compiler_version != "None"]
        - if not exist %LIBRARY_INC%\\onnxruntime\\core\\session\\onnxruntime_cxx_api.h exit 1  # [win]
        - if not exist %LIBRARY_LIB%\\onnxruntime_conda.lib exit 1  # [win]
        - if not exist %LIBRARY_BIN%\\onnxruntime_conda.dll exit 1  # [win]
        - if not exist %LIBRARY_LIB%\\onnxruntime_providers_shared.lib exit 1  # [win and cuda_compiler_version != "None"]
        - if not exist %LIBRARY_BIN%\\onnxruntime_providers_shared.dll exit 1  # [win and cuda_compiler_version != "None"]
        - if not exist %LIBRARY_LIB%\\onnxruntime_providers_cuda.lib exit 1  # [win and cuda_compiler_version != "None"]
        - if not exist %LIBRARY_BIN%\\onnxruntime_providers_cuda.dll exit 1  # [win and cuda_compiler_version != "None"]
        - $CXX $CXXFLAGS -I$PREFIX/include/ -L$PREFIX/lib/ -lonnxruntime test.cpp                               # [linux]
        - $CXX $CXXFLAGS -I$PREFIX/include/ -L$PREFIX/lib/ -lonnxruntime -Wl,-rpath,$CONDA_PREFIX/lib test.cpp  # [osx]
        - ./a.out  # [unix]
        - call .\run_cpp_test.bat  # [win]
        - cmake-package-check onnxruntime --targets onnxruntime::onnxruntime
        # A C++ program using libonnx, libprotobuf and onnxruntime in one process.
        - cmake -S cpp_interop -B build_interop -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PREFIX  # [unix]
        - cmake -S cpp_interop -B build_interop -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%LIBRARY_PREFIX%  # [win]
        - cmake --build build_interop
        - ./build_interop/test_onnx_interop  # [unix]
        - build_interop\test_onnx_interop.exe  # [win]

about:
  home: https://github.com/microsoft/onnxruntime/
  summary: cross-platform, high performance ML inferencing and training accelerator
  license: MIT AND BSL-1.0  # mp11 is BSL 1.0
  license_file:
    - LICENSE
    - build-ci/Release/_deps/eigen3-src/COPYING.MPL2
    - build-ci/Release/_deps/gsl-src/LICENSE
    - build-ci/Release/_deps/nlohmann_json-src/LICENSE.MIT  # [not unix]
    - build-ci/Release/_deps/pytorch_cpuinfo-src/LICENSE
    - build-ci/Release/_deps/safeint-src/LICENSE
    - build-ci/Release/_deps/fp16-src/LICENSE   # [osx and arm64]
    - build-ci/Release/_deps/psimd-src/LICENSE  # [osx and arm64]

extra:
  recipe-maintainers:
    - xhochy
    - janjagusch
    # jtilly is interested in novec for linux due to numerical discrepancies
    # between eigen's vectorization and onnx's
    - jtilly
    - cbourjau
    # General support for GPUs
    - hmaarrfk
    # Especially interested in Windows
    - traversaro
