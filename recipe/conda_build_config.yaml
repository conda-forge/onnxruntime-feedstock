suffix:
- ''
- -novec

# The CoreML execution provider references macOS 13-era CoreML APIs
# (e.g. MLComputeUnitsCPUAndNeuralEngine) that are not in the 11.0 SDK.
# Bump only the SDK used to compile; MACOSX_DEPLOYMENT_TARGET stays at the
# pinning default (11.0) since newer APIs are runtime-gated via @available.
MACOSX_SDK_VERSION:  # [osx]
- '13.3'             # [osx]

github_actions_labels:                # [linux or win]
- namespace-profile-16cpu-on-linux-64 # [linux]
- namespace-profile-16cpu-on-win-64   # [win]

# TensorRT execution provider (prototype). Dedicated on/off axis on the linux
# platforms; the recipe only actually enables TensorRT on the CUDA 13.0 build
# (see `tensorrt_enabled` in recipe.yaml). The inert `tensorrt: true`
# combinations (CPU / CUDA 12.9) are skipped in build.skip. The TensorRT
# packages (libnvinfer / libnvonnxparser and their -devel/-headers) now come
# from conda-forge, which ships CUDA 13.0 builds for linux-64 and linux-aarch64.
tensorrt:   # [linux]
- 'false'   # [linux]
- 'true'    # [linux]
