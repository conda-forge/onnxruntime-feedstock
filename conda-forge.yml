build_platform:
  linux_aarch64: linux_64
  linux_ppc64le: linux_64
  osx_arm64: osx_arm64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
github_actions:
  timeout_minutes: 720
  triggers:
  - push
  - pull_request
provider:
  linux_64: github_actions
  win_64: github_actions
  osx_arm64: github_actions
test: native_and_emulated
workflow_settings:
  # TEMPORARY: upload the linux-64 packages (CUDA included) as CI artifacts so the
  # CUDA execution provider can be tested on a real GPU. Remove before merging.
  store_build_artifacts:
  - provider: github_actions
    platform: linux_64
    value: true
  build_workspace_dir:
  - provider: azure
    os: win
    value: C:\bld\
  free_disk_space:
  - provider: azure
    value: quick
  pagefile_size:
  - provider: azure
    os: linux
    value: 10
  - provider: azure
    os: win
    value: 16
  tools_install_dir:
  - provider: azure
    os: win
    value: C:\Miniforge
